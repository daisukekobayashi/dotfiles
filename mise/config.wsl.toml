[tools]
neovim = "0.12"
zellij = "0.43"
ripgrep = "15"
fzf = "0.74.5"
fd = "10.5.0"
bat = "0.26.1"
zoxide = "0.10.0"
# musl builds: the gnu builds require glibc 2.39 (Ubuntu 24.04+).
"github:atuinsh/atuin" = { version = "18.24.2", asset_pattern = "atuin-x86_64-unknown-linux-musl.tar.gz" }
"github:sxyazi/yazi" = { version = "26.9.1", asset_pattern = "yazi-x86_64-unknown-linux-musl.zip" }
delta = "0.20.1"
lazygit = "0.59"
lazydocker = "0.25"
oxker = "0.13"
gitui = "0.28"
"aqua:dlvhdr/gh-dash" = "4.26.2"
mprocs = "0.9.3"
just = "1.59.0"
watchexec = "2.8.0"
process-compose = "1.124.0"
"cargo:pueue" = "4.0.4"
duf = "0.9.1"
gdu = "5.38.0"
dua = "2.46.0"
dust = "1.2.6"
"aqua:jorgerojas26/lazysql" = "0.5.0"
"pipx:harlequin" = { version = "2.5.2", uvx_args = "--python 3.13" }
glow = "2.1.2"
ast-grep = "0.43.0"
jless = "0.9.0"
"aqua:noahgorstein/jqp" = "0.8.0"
"aqua:tstack/lnav" = "0.14.1"
"aqua:wagoodman/dive" = "0.13.1"
"aqua:hatoo/oha" = "1.16.0"
"aqua:derailed/k9s" = "0.51.0"
"cargo:termscp" = { version = "1.0.0", default-features = false }
eza = "0.23.5"
jq = "1.8.2"
yq = "4.54.1"
sd = "1.1.0"
hyperfine = "1.20.0"
"aqua:dalance/procs" = "0.14.12"
xh = "0.26.3"
tokei = "14.0.0"
"github:aristocratos/btop" = "1.4"
github-cli = "2"
ruff = "0.17"
uv = "0.13"
yt-dlp = "2026.10.26"
azure = "2"
aws-cli = "2"
terraform = "1.14"
"cargo:tree-sitter-cli" = "0.26.8"
typst = "0.14"
shellcheck = "0.11"
bats = "1.13"
"aqua:gastownhall/beads" = "1.0"
"github:betterleaks/betterleaks" = "1.6.0"

[settings]
cargo.binstall = false

[tools."http:resterm"]
version = "0.39.5"
url = "https://github.com/unkn0wn-root/resterm/releases/download/v{{ version }}/resterm_Linux_x86_64"
bin = "resterm"

[tools."http:csvlens"]
version = "0.15.1"
url = "https://github.com/YS-L/csvlens/releases/download/v{{ version }}/csvlens-x86_64-unknown-linux-gnu.tar.xz"
bin = "csvlens"

[tools."http:bandwhich"]
version = "0.23.1"
url = "https://github.com/imsnif/bandwhich/releases/download/v{{ version }}/bandwhich-v{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
bin = "bandwhich"

[tools."http:trippy"]
version = "0.13.0"
url = "https://github.com/fujiapple852/trippy/releases/download/{{ version }}/trippy-{{ version }}-x86_64-unknown-linux-musl.tar.gz"
bin = "trip"

[tools."http:termshark"]
version = "2.4.0"
url = "https://github.com/gcla/termshark/releases/download/v{{ version }}/termshark_{{ version }}_linux_x64.tar.gz"
bin = "termshark"

# The vfox gcloud plugin fails on newer mise; the tarball bundles Python.
[tools."http:gcloud"]
version = "591.0.0"
url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{ version }}-linux-x86_64.tar.gz"
bin_path = "google-cloud-sdk/bin"
